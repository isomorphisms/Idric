name: Idriç build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: idric-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    env:
      IDRIC_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact Idriç head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3 util-linux

      - name: Prepare exact-head receipt and test the acceptance harness
        run: |
          python3 xbrl_acceptance.py prepare
          python3 -m unittest discover -s _/tests/xbrl -v

      - name: Bootstrap through the follower-visible Edriç entrypoint
        run: |
          if ./edric all; then
            python3 xbrl_acceptance.py stamp-build
          else
            python3 xbrl_acceptance.py fail-build
            exit 1
          fi

      - name: Verify follower-visible compiler paths
        shell: sh
        run: |
          set -eu
          test -L .tools
          test "$(readlink .tools)" = "_/.tools"
          test -L bootstrap-build
          test "$(readlink bootstrap-build)" = "_/bootstrap-build"
          test -L build
          test "$(readlink build)" = "_/build"
          test -x build/exec/idris2
          build/exec/idris2 --version

      - name: Compile the Idriç TM media qualification runner
        working-directory: examples/autogenerated/tm-media-qualification
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_/libs/prelude/build/ttc:${{ github.workspace }}/_/libs/base/build/ttc:${{ github.workspace }}/_/libs/contrib/build/ttc
        run: >-
          env CHEZ="$GITHUB_WORKSPACE/_/.tools/bin/scheme"
          PATH="$GITHUB_WORKSPACE/_/.tools/bin:$PATH"
          "$GITHUB_WORKSPACE/_/build/exec/idris2" --cg chez
          --build-dir "$GITHUB_WORKSPACE/_/build/tm-runner-build"
          --output-dir "$GITHUB_WORKSPACE/_/build/tm-runner"
          -o qualify Qualify.idric

      - name: Execute TM media contracts and intended negative controls
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_/libs/prelude/build/ttc:${{ github.workspace }}/_/libs/base/build/ttc:${{ github.workspace }}/_/libs/contrib/build/ttc
        run: >-
          env CHEZ="$GITHUB_WORKSPACE/_/.tools/bin/scheme"
          PATH="$GITHUB_WORKSPACE/_/.tools/bin:$PATH"
          "$GITHUB_WORKSPACE/_/build/tm-runner/qualify"
          "$GITHUB_WORKSPACE/_/build/exec/idris2"
          "$GITHUB_WORKSPACE/examples/autogenerated/tm-media-qualification"
          "$GITHUB_WORKSPACE/_/build/tm-media"

      - name: Retain TM media command receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tm-media-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            _/build/tm-media/
            _/build/tm-runner/
          if-no-files-found: warn
          retention-days: 14

      - name: Execute Idriç multiplication and division glyph regression
        run: ./edric test --only idris2/basic/edric011

      - name: Verify follower-visible environment export contract
        run: ./edric test --only base/system_environment_value

      - name: Package dependency separator compatibility
        run: ./edric test --only idris2/pkg/pkg006

      - name: Inherited Idris prefix fixity compatibility
        run: ./edric test --only idris2/misc/import009

      - name: Offline XBRL compiler acceptance
        run: sudo --preserve-env=IDRIC_EXPECTED_HEAD unshare --net -- python3 xbrl_acceptance.py run

      - name: Acquire the pinned shared material observer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/ai-ci
          ref: f4c60ef97eff659dcaccbcf51ae0e04e61bb350a
          path: _/build/tm-material-owner
          persist-credentials: false

      - name: Prepare the complete Idriç compiler and runtime package
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_/libs/prelude/build/ttc:${{ github.workspace }}/_/libs/base/build/ttc:${{ github.workspace }}/_/libs/contrib/build/ttc
        run: >-
          env CHEZ="$GITHUB_WORKSPACE/_/.tools/bin/scheme"
          "$GITHUB_WORKSPACE/_/build/tm-runner/qualify" --prepare-bundle
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/_/build/tm-material-owner"
          "$GITHUB_WORKSPACE/_/build/tm-runner/qualify_app/qualify.so"
          "$GITHUB_WORKSPACE/_/build/tm-bundle"
          "$GITHUB_WORKSPACE/_/build/tm-package-receipts"

      - name: Archive the compiler package
        working-directory: _/build
        run: tar -czf tm-idric-linux-x86_64.tar.gz tm-bundle

      - name: Record the delivered archive identity
        working-directory: _/build
        run: sha256sum tm-idric-linux-x86_64.tar.gz > tm-idric-linux-x86_64.tar.gz.sha256

      - name: Deliver the source-bound compiler archive and caller expectations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tm-idric-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            _/build/tm-idric-linux-x86_64.tar.gz
            _/build/tm-idric-linux-x86_64.tar.gz.sha256
            _/build/tm-package-receipts/approved-material.txt
            _/build/tm-package-receipts/required.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Retain exact-head receipt, observations and compiler artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xbrl-acceptance-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: _/build/xbrl-acceptance/
          if-no-files-found: error
          retention-days: 14

  tm-media-archive-replay:
    needs: compiler
    runs-on: ubuntu-latest
    env:
      IDRIC_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Acquire this exact build without checking out producer source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tm-idric-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/tm-consumer

      - name: Verify the archive identity before extraction
        working-directory: ${{ runner.temp }}/tm-consumer
        run: sha256sum --check --strict tm-idric-linux-x86_64.tar.gz.sha256

      - name: Extract the unchanged delivered package
        working-directory: ${{ runner.temp }}/tm-consumer
        run: tar -xzf tm-idric-linux-x86_64.tar.gz

      - name: Admit all material and reject payload and manifest corruption
        working-directory: ${{ runner.temp }}/tm-consumer
        run: >-
          env -i PATH=/usr/bin:/bin
          SCHEMEHEAPDIRS="$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/lib/csv10.4.1/ta6le"
          IDRIS2_PREFIX="$RUNNER_TEMP/tm-consumer/tm-bundle/compiler"
          LD_LIBRARY_PATH="$RUNNER_TEMP/tm-consumer/tm-bundle/compiler/app"
          CHEZ="$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/bin/scheme"
          "$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/bin/scheme" --script
          "$RUNNER_TEMP/tm-consumer/tm-bundle/verification/qualify.so" --verify-bundle
          "$RUNNER_TEMP/tm-consumer/tm-bundle"
          "$RUNNER_TEMP/tm-consumer/tm-package-receipts/approved-material.txt"
          "$RUNNER_TEMP/tm-consumer/tm-package-receipts/required.tsv"
          "$RUNNER_TEMP/tm-consumer/material-checks"

      - name: Compile and execute the media ladder using only delivered material
        working-directory: ${{ runner.temp }}/tm-consumer
        run: >-
          env -i PATH=/usr/bin:/bin
          SCHEMEHEAPDIRS="$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/lib/csv10.4.1/ta6le"
          IDRIS2_PREFIX="$RUNNER_TEMP/tm-consumer/tm-bundle/compiler"
          LD_LIBRARY_PATH="$RUNNER_TEMP/tm-consumer/tm-bundle/compiler/app"
          CHEZ="$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/bin/scheme"
          IDRIC_EXPECTED_HEAD="$IDRIC_EXPECTED_HEAD"
          "$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/bin/scheme" --script
          "$RUNNER_TEMP/tm-consumer/tm-bundle/verification/qualify.so" --bundle
          "$RUNNER_TEMP/tm-consumer/tm-bundle" "$RUNNER_TEMP/tm-consumer/media-checks"

      - name: Recheck delivered material after execution
        working-directory: ${{ runner.temp }}/tm-consumer
        run: >-
          env -i PATH=/usr/bin:/bin
          SCHEMEHEAPDIRS="$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/lib/csv10.4.1/ta6le"
          IDRIS2_PREFIX="$RUNNER_TEMP/tm-consumer/tm-bundle/compiler"
          LD_LIBRARY_PATH="$RUNNER_TEMP/tm-consumer/tm-bundle/compiler/app"
          CHEZ="$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/bin/scheme"
          "$RUNNER_TEMP/tm-consumer/tm-bundle/runtime/bin/scheme" --script
          "$RUNNER_TEMP/tm-consumer/tm-bundle/verification/qualify.so" --admit-bundle
          "$RUNNER_TEMP/tm-consumer/tm-bundle"
          "$RUNNER_TEMP/tm-consumer/tm-package-receipts/approved-material.txt"
          "$RUNNER_TEMP/tm-consumer/tm-package-receipts/required.tsv"
          "$RUNNER_TEMP/tm-consumer/post-execution-material"

      - name: Retain archive-consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tm-media-replay-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tm-consumer/material-checks/*.command
            ${{ runner.temp }}/tm-consumer/material-checks/*.status
            ${{ runner.temp }}/tm-consumer/material-checks/*.stdout
            ${{ runner.temp }}/tm-consumer/material-checks/*.stderr
            ${{ runner.temp }}/tm-consumer/material-checks/qualification.txt
            ${{ runner.temp }}/tm-consumer/media-checks/
            ${{ runner.temp }}/tm-consumer/post-execution-material/
          if-no-files-found: warn
          retention-days: 14
