name: One-shot readable TTImp vocabulary on flattened source

on:
  push:
    branches:
      - readable-ttimp-core
    paths:
      - .github/workflows/one-shot-readable-ttimp-flat.yml

permissions:
  contents: write

jobs:
  rename-build-and-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the readable-core branch
        uses: actions/checkout@v4

      - name: Spell out the compiler-internal TTImp vocabulary
        shell: bash
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from collections import Counter
          from pathlib import Path

          mapping = {
              # Raw elaboratable terms.
              "IWithUnambigNames": "Elaboratable_With_Unambiguous_Names",
              "ICaseLocal": "Elaboratable_Case_Local_Definition",
              "INamedApp": "Elaboratable_Named_Apply",
              "IAutoApp": "Elaboratable_Automatic_Apply",
              "IWithApp": "Elaboratable_With_Apply",
              "IAlternative": "Elaboratable_Alternative",
              "IMustUnify": "Elaboratable_Must_Unify",
              "IBindHere": "Elaboratable_Bind_Here",
              "IBindVar": "Elaboratable_Bind_Name",
              "IQuoteName": "Elaboratable_Quote_Name",
              "IQuoteDecl": "Elaboratable_Quote_Declarations",
              "IRunElab": "Elaboratable_Run_Elaborator",
              "IPrimVal": "Elaboratable_Primitive_Value",
              "IUnifyLog": "Elaboratable_Unification_Log",
              "IDelayed": "Elaboratable_Delayed_Type",
              "IRewrite": "Elaboratable_Rewrite",
              "ICoerced": "Elaboratable_Coerced",
              "IUpdate": "Elaboratable_Record_Update",
              "ISearch": "Elaboratable_Search",
              "IUnquote": "Elaboratable_Unquote",
              "ILocal": "Elaboratable_Local_Definitions",
              "IForce": "Elaboratable_Force",
              "IQuote": "Elaboratable_Quote",
              "IDelay": "Elaboratable_Delay",
              "IHole": "Elaboratable_Hole",
              "IType": "Elaboratable_Type_Universe",
              "ICase": "Elaboratable_Case",
              "IApp": "Elaboratable_Apply",
              "ILet": "Elaboratable_Binding",
              "ILam": "Elaboratable_Lambda",
              "IPi": "Elaboratable_Dependent_Function_Type",
              "IAs": "Elaboratable_As_Pattern",
              "IVar": "Elaboratable_Name",

              # Record-field updates used by raw terms.
              "ISetFieldApp": "Elaboratable_Apply_To_Field",
              "ISetField": "Elaboratable_Set_Field",
              "IFieldUpdate'": "Elaboratable_Field_Update'",
              "IFieldUpdate": "Elaboratable_Field_Update",
              "IField'": "Elaboratable_Field'",
              "IField": "Elaboratable_Field",

              # Elaboratable declarations.
              "IRunElabDecl": "Elaboratable_Run_Elaborator_Declaration",
              "IParameters": "Elaboratable_Parameter_Block",
              "INamespace": "Elaboratable_Namespace_Block",
              "ITransform": "Elaboratable_Transformation",
              "IBuiltin": "Elaboratable_Builtin_Declaration",
              "IRecord": "Elaboratable_Record_Declaration",
              "IClaim": "Elaboratable_Claim",
              "IData": "Elaboratable_Data_Declaration",
              "IDef": "Elaboratable_Definition",
              "IFail": "Elaboratable_Expected_Failure",
              "IPragma": "Elaboratable_Pragma",
              "ILog": "Elaboratable_Logging",

              # Nearby compiler-internal names whose leading I was equally opaque.
              "MkIClaimData": "Make_Elaboratable_Claim_Data",
              "IClaimData": "Elaboratable_Claim_Data",
              "IRawImp": "Kinded_Elaboratable_Term",
              "IImpClause": "Kinded_Elaboratable_Clause",
              "IArg": "Kinded_Elaboratable_Argument",
              "isIPrimVal": "is_primitive_value",
              "isIVar": "is_elaboratable_name",
              "isIBindVar": "is_elaboratable_bound_name",
              "findIBinds": "find_names_to_bind",
              "unIArg": "elaboratable_argument_term",
          }

          identifier_char = r"A-Za-z0-9_'"
          patterns = {
              old: re.compile(rf"(?<![{identifier_char}]){re.escape(old)}(?![{identifier_char}])")
              for old in mapping
          }
          ordered_names = sorted(mapping, key=len, reverse=True)

          def string_spans(text: str):
              index = 0
              while index < len(text):
                  if text[index] != '"':
                      index += 1
                      continue
                  start = index
                  index += 1
                  escaped = False
                  while index < len(text):
                      character = text[index]
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == '"':
                          index += 1
                          break
                      index += 1
                  yield start, index

          def replace_code_segment(segment: str, counts: Counter[str]) -> str:
              rewritten = segment
              for old in ordered_names:
                  rewritten, number = patterns[old].subn(mapping[old], rewritten)
                  counts[old] += number
              return rewritten

          def replace_outside_strings(text: str, counts: Counter[str]) -> str:
              pieces: list[str] = []
              code_start = 0
              for string_start, string_end in string_spans(text):
                  pieces.append(replace_code_segment(text[code_start:string_start], counts))
                  pieces.append(text[string_start:string_end])
                  code_start = string_end
              pieces.append(replace_code_segment(text[code_start:], counts))
              return "".join(pieces)

          def mask_strings(text: str) -> str:
              pieces: list[str] = []
              code_start = 0
              for string_start, string_end in string_spans(text):
                  pieces.append(text[code_start:string_start])
                  pieces.append(" " * (string_end - string_start))
                  code_start = string_end
              pieces.append(text[code_start:])
              return "".join(pieces)

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          counts: Counter[str] = Counter()
          changed: list[str] = []
          source_files: list[Path] = []

          for raw_path in tracked:
              if not raw_path:
                  continue
              relative = raw_path.decode("utf-8")
              path = Path(relative)

              # The current Idriç layout exposes compiler source at repository
              # top level. The upstream project machinery and public reflection
              # library live under _ and deliberately keep their established API.
              if relative.startswith("_/") or relative.startswith(".github/"):
                  continue
              if path.suffix not in {".idr", ".lidr", ".ipkg"}:
                  continue

              source_files.append(path)
              original = path.read_text(encoding="utf-8")
              rewritten = replace_outside_strings(original, counts)
              if rewritten != original:
                  path.write_text(rewritten, encoding="utf-8")
                  changed.append(relative)

          never_seen = [old for old in mapping if counts[old] == 0]
          if never_seen:
              raise SystemExit(
                  "Compiler-internal rename keys not found: " + ", ".join(never_seen)
              )

          leftovers: list[str] = []
          for path in source_files:
              source_text = mask_strings(path.read_text(encoding="utf-8"))
              for old, pattern in patterns.items():
                  if pattern.search(source_text):
                      leftovers.append(f"{path}: {old}")

          if leftovers:
              raise SystemExit(
                  "Old compiler-internal TTImp names remain:\n"
                  + "\n".join(leftovers[:200])
              )

          principal = [
              ("IVar", "Elaboratable_Name", "a referenced name"),
              ("IApp", "Elaboratable_Apply", "apply one term to another"),
              ("ILet", "Elaboratable_Binding", "a local binding"),
              (
                  "IPi",
                  "Elaboratable_Dependent_Function_Type",
                  "a function type whose result may depend on its input",
              ),
              ("ILam", "Elaboratable_Lambda", "a lambda expression"),
              ("ICase", "Elaboratable_Case", "a case expression"),
          ]
          lines = [
              "# Readable TTImp names",
              "",
              "This branch spells out the constructor vocabulary of Idris's compiler-internal raw, elaboratable term layer.",
              "`Elaboratable_` replaces the unexplained one-letter constructor prefix and keeps these names distinct from the checked core term constructors.",
              "The compiler source itself describes this layer as the raw form which is elaborated into checked core terms.",
              "",
              "## Main reading vocabulary",
              "",
              "| Upstream name | Name on this branch | Meaning |",
              "|---|---|---|",
          ]
          lines.extend(
              f"| `{old}` | `{new}` | {meaning} |"
              for old, new, meaning in principal
          )
          lines.extend(
              [
                  "",
                  "## Complete compiler-internal rename",
                  "",
                  "| Upstream name | Name on this branch | Source occurrences changed |",
                  "|---|---|---:|",
              ]
          )
          lines.extend(
              f"| `{old}` | `{mapping[old]}` | {counts[old]} |"
              for old in sorted(mapping)
          )
          lines.extend(
              [
                  "",
                  "## Reflection compatibility boundary",
                  "",
                  "The public constructors in `_/libs/base/Language/Reflection/TTImp.idr` retain their upstream names.",
                  "Those names are part of the elaborator-reflection interface and are embedded in the checked-in bootstrap compiler.",
                  "`TTImp/Reflect.idr` uses readable constructors internally while translating to and from the established serialized names.",
                  "",
              ]
          )
          Path("TTIMP_READABLE_NAMES.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )

          print(f"Changed {len(changed)} compiler source files.")
          for relative in changed:
              print(relative)
          PY

          # Intent-to-add makes the new vocabulary guide part of the saved patch.
          git add -N TTIMP_READABLE_NAMES.md
          git diff --check
          git diff --stat
          git diff --binary > /tmp/readable-ttimp.patch

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

      - name: Bootstrap and test the renamed compiler
        run: ./_/edric all

      - name: Commit only the checked source rewrite
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fdx
          git apply /tmp/readable-ttimp.patch
          git rm .github/workflows/one-shot-readable-ttimp-flat.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Spell out compiler-internal TTImp vocabulary"
          git push origin HEAD:readable-ttimp-core
