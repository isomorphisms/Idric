name: Idriç source-layout check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, debian]
    steps:
      - uses: actions/checkout@v4
      - name: Verify flattened source layout
        run: |
          test -d Core
          test -d TTImp
          test -L _/src
          test "$(readlink _/src)" = ".."
      - name: Verify top-level edric compatibility entrypoint
        shell: sh
        run: |
          test -x edric
          dash -n edric
          sh -n edric
          ./edric --help | grep -F 'usage: ./_/edric'
