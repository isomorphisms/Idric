name: Idriç source-layout check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify flattened source layout
        run: |
          test -d Core
          test -d TTImp
          test -L _/src
          test "$(readlink _/src)" = ".."
