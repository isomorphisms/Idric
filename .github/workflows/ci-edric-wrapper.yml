name: Edric wrapper

on:
  push:
    branches:
      - 'Idriç'
    paths:
      - 'edric'
      - 'scripts/ensure-chez.sh'
      - '.github/workflows/ci-edric-wrapper.yml'
  pull_request:
    branches:
      - 'Idriç'
    paths:
      - 'edric'
      - 'scripts/ensure-chez.sh'
      - '.github/workflows/ci-edric-wrapper.yml'

jobs:
  private-scheme-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify private Scheme owns bootstrap and test codegen
        shell: bash
        run: |
          set -euo pipefail

          toolchain="$RUNNER_TEMP/edric-toolchain"
          fake_make="$RUNNER_TEMP/edric-make"
          mkdir -p "$toolchain/bin"

          cat > "$toolchain/bin/scheme" <<'SCHEME'
          #!/bin/sh
          cat >/dev/null
          printf '#t\n'
          SCHEME
          chmod +x "$toolchain/bin/scheme"

          cat > "$fake_make" <<'MAKE'
          #!/bin/sh
          set -eu
          expected="$EDRIC_TOOLCHAIN_DIR/bin/scheme"
          actual=$(command -v scheme || true)
          if [ "$actual" != "$expected" ]; then
              echo "expected private scheme at $expected, got ${actual:-<none>}" >&2
              exit 1
          fi
          if [ "${CHEZ:-}" != "$expected" ]; then
              echo "expected CHEZ=$expected, got ${CHEZ:-<unset>}" >&2
              exit 1
          fi
          case " $* " in
              *" bootstrap SCHEME=$expected "*) ;;
              *" test only=idris2/basic/edric008 "*) ;;
              *)
                  echo "unexpected wrapper make invocation: $*" >&2
                  exit 1
                  ;;
          esac
          MAKE
          chmod +x "$fake_make"

          EDRIC_TOOLCHAIN_DIR="$toolchain" MAKE="$fake_make" ./edric bootstrap
          EDRIC_TOOLCHAIN_DIR="$toolchain" MAKE="$fake_make" \
            ./edric test --only idris2/basic/edric008
