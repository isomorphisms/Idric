name: Edric higher-math smoke

on:
  pull_request:
    branches:
      - 'Idriç'
  push:
    branches:
      - 'Idriç'

jobs:
  higher-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Bootstrap Edric
        run: ./edric bootstrap

      - name: Compile higher-math fixtures
        run: ./edric test --only idris2/basic/edric008
