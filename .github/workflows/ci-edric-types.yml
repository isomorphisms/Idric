name: Idriç type-system smoke

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  qualified-ick:
    runs-on: ubuntu-24.04
    steps:
      - uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
  units-time-intervals:
    needs: qualified-ick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Qualify the selected native compiler for owned support code
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Bootstrap Idriç and run focused smoke suite
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: ./_/edric all
      - name: Check named and nested with clauses in Idris and IDE mode
        run: |
          for suite in idris2/with/with005 idris2/with/with010 idris2/with/with012 ideMode/ideMode014; do
            ./_/edric test --only "$suite"
          done
      - name: Read previous with-clause bytes and preserve the writer's representation
        working-directory: ${{ runner.temp }}
        run: |
          work=$(mktemp -d)
          cd "$work"
          fixture="$GITHUB_WORKSPACE/_/tests/compiler/with-equality-binding"
          cp "$fixture/WithBinding.idr" "$fixture/ObservedValue.idric" .
          export IDRIS2_PATH="$GITHUB_WORKSPACE/_/build/ttc"
          export IDRIS2_PREFIX="$GITHUB_WORKSPACE/_/bootstrap-build"
          export PATH="$GITHUB_WORKSPACE/_/.tools/bin:$PATH"
          compiler="$GITHUB_WORKSPACE/_/build/exec/idris2"
          "$compiler" --check ObservedValue.idric
          "$compiler" --cg chez -o observed-value ObservedValue.idric
          test "$(./build/exec/observed-value)" = "(False, False)"
          mkdir dropped
          sed 's/ proof result_matches$//' ObservedValue.idric > dropped/ObservedValue.idric
          if (cd dropped && "$compiler" --check ObservedValue.idric) > dropped.log 2>&1; then
            exit 1
          fi
          grep -F "Undefined name result_matches" dropped.log
          "$compiler" --check WithBinding.idr
          "$compiler" --cg chez -o with-binding WithBinding.idr
          xxd -r -p "$fixture/baseline.hex" > baseline.bin
          ./build/exec/with-binding read baseline.bin
          ./build/exec/with-binding write candidate.bin
          cmp baseline.bin candidate.bin
      - name: Keep generated smoke sources inside the existing build directory
        run: |
          test ! -e _/tests/idris2/basic/edric007/Tests.idr
          test ! -e _/tests/idris2/basic/edric007/UnitsTimeIntervals.idr
          cmp _/examples/units-time-intervals/Tests.idric _/tests/idris2/basic/edric007/build/units-time-intervals/Tests.idr
          cmp _/examples/units-time-intervals/UnitsTimeIntervals.idric _/tests/idris2/basic/edric007/build/units-time-intervals/UnitsTimeIntervals.idr
          test -z "$(git status --porcelain --untracked-files=all -- _/tests/idris2/basic/edric007)"
