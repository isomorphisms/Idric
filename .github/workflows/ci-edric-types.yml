name: Idriç type-system smoke

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  qualified-ick:
    runs-on: ubuntu-24.04
    steps:
      - uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
  units-time-intervals:
    needs: qualified-ick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Qualify the selected native compiler for owned support code
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Bootstrap Idriç and run focused smoke suite
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: ./_/edric all
