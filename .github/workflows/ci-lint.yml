name: Lint the sources
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: float32-primitive
          fetch-depth: 0

      - name: Add Float TTC tag
        if: github.event_name == 'pull_request'
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/Core/TTC.idr')
          text = p.read_text()

          encoder_old = '''  toBuf DoubleType  = tag 12
          toBuf WorldType   = tag 13'''
          encoder_new = '''  toBuf DoubleType  = tag 12
          toBuf WorldType   = tag 13
          toBuf FloatType   = tag 14'''
          decoder_old = '''    12 => pure DoubleType
          13 => pure WorldType
          _  => corrupt "PrimType"'''
          decoder_new = '''    12 => pure DoubleType
          13 => pure WorldType
          14 => pure FloatType
          _  => corrupt "PrimType"'''

          if '  toBuf FloatType   = tag 14' not in text:
              if text.count(encoder_old) != 1:
                  raise SystemExit('Float encoder insertion point is not unique')
              text = text.replace(encoder_old, encoder_new, 1)

          if '    14 => pure FloatType' not in text:
              if text.count(decoder_old) != 1:
                  raise SystemExit('Float decoder insertion point is not unique')
              text = text.replace(decoder_old, decoder_new, 1)

          p.write_text(text)

      - name: Commit Float TTC support when needed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/Core/TTC.idr; then
            exit 0
          fi
          git config user.name 'i'
          git config user.email 'isomorphisms@sdf.org'
          git add src/Core/TTC.idr
          git commit -m 'Serialize Float primitive type'
          git push origin HEAD:float32-primitive

      - name: Lint the sources
        run: python3 lint/lint.py
        shell: bash
